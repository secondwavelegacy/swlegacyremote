<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Trade Control</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#050505;
  color:white;
  padding:20px;
}

.container{
  max-width:1400px;
  margin:auto;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px;
  border:1px solid rgba(255,255,255,0.08);
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(20px);
  border-radius:25px;
  margin-bottom:25px;
  flex-wrap:wrap;
  gap:15px;
}

.logo h1{
  color:#ffb300;
  letter-spacing:3px;
}

.logo p{
  color:rgba(255,255,255,0.45);
  margin-top:5px;
  font-size:13px;
}

.menu{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.menu-link{
  text-decoration:none;
  color:rgba(255,255,255,0.65);
  padding:10px 18px;
  border-radius:14px;
  transition:0.3s;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.05);
  font-size:14px;
}

.menu-link:hover{
  color:#ffb300;
  border:1px solid rgba(255,179,0,0.25);
  background:rgba(255,179,0,0.08);
}

.menu-link.active{
  background:linear-gradient(
    135deg,
    #ffcc00,
    #ff9800
  );

  color:black;
  font-weight:600;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
}

.card{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  border-radius:28px;
  padding:25px;
}

.title{
  font-size:18px;
  margin-bottom:20px;
  font-weight:600;
}

.control-btn{
  width:100%;
  border:none;
  padding:16px;
  border-radius:18px;
  margin-bottom:14px;
  font-weight:600;
  color:white;
  cursor:pointer;
  transition:0.3s;
  font-size:15px;
}

.control-btn:hover{
  transform:translateY(-2px);
}

.red{
  background:linear-gradient(135deg,#ff3c3c,#ff6b00);
}

.blue{
  background:linear-gradient(135deg,#2979ff,#00c6ff);
}

.gold{
  background:linear-gradient(135deg,#ffcc00,#ff9800);
  color:black;
}

.green{
  background:linear-gradient(135deg,#00ff99,#00cc66);
  color:black;
}

.purple{
  background:linear-gradient(135deg,#b721ff,#6e00ff);
}

</style>

</head>

<body>

<div class="container">

  <div class="topbar">

    <div class="logo">
      <h1>SECOND WAVE</h1>
      <p>Trade Execution Panel</p>
    </div>

    <div class="menu">

      <a href="dashboard.html" class="menu-link">
        Dashboard
      </a>

      <a href="control.html" class="menu-link active">
        Trade Control
      </a>

      <a href="analytics.html" class="menu-link">
        Analytics
      </a>

      <a href="settings.html" class="menu-link">
        Settings
      </a>

    </div>

  </div>

  <div class="grid">

    <div class="card">

      <div class="title">
        Trade Execution
      </div>

      <button class="control-btn red">
        CLOSE ALL TRADES
      </button>

      <button class="control-btn blue">
        CLOSE LOSING TRADES
      </button>

      <button class="control-btn gold">
        CLOSE PROFITABLE TRADES
      </button>

    </div>

    <div class="card">

      <div class="title">
        Risk Management
      </div>

      <button class="control-btn green">
        MOVE TO BREAKEVEN
      </button>

      <button class="control-btn purple">
        ENABLE TRAILING STOP
      </button>

      <button class="control-btn blue">
        LOCK PROFIT
      </button>

    </div>

    <div class="card">

      <div class="title">
        Emergency Actions
      </div>

      <button class="control-btn red">
        EMERGENCY CLOSE
      </button>

      <button class="control-btn gold">
        DISABLE EA
      </button>

      <button class="control-btn purple">
        RESTART CONNECTION
      </button>

    </div>

  </div>

</div>

</body>
</html>
