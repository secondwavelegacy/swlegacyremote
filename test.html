<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Close All Center</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #fff;
            height: 100vh; /* Penuh tinggi viewport */
            display: flex;
            justify-content: center; /* center horizontal */
            align-items: center;     /* center vertical */
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #ff4c4c;
            border: none;
            color: #fff;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <button id="closeAllBtn">Close All</button>

    <script>
        const closeAllBtn = document.getElementById('closeAllBtn');

        closeAllBtn.addEventListener('click', () => {
            alert("Semua elemen ditutup!"); // Contoh aksi, boleh ubah ikut fungsi sebenar
        });
    </script>
</body>
</html>
