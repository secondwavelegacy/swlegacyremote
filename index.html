<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>SECOND WAVE LOGIN</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#050505;
  overflow:hidden;
  color:white;
}

/* Glow Background */

body::before{
  content:'';
  position:absolute;
  width:500px;
  height:500px;
  background:rgba(255,179,0,0.12);
  filter:blur(120px);
  top:-150px;
  left:-150px;
}

body::after{
  content:'';
  position:absolute;
  width:400px;
  height:400px;
  background:rgba(255,120,0,0.10);
  filter:blur(120px);
  bottom:-150px;
  right:-150px;
}

/* Login Box */

.login-box{
  width:380px;
  padding:40px;
  border-radius:30px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  box-shadow:0 10px 50px rgba(0,0,0,0.4);
  position:relative;
  z-index:2;
}

.logo{
  text-align:center;
  margin-bottom:35px;
}

.logo h1{
  color:#ffb300;
  letter-spacing:4px;
  font-size:34px;
}

.logo p{
  color:rgba(255,255,255,0.45);
  margin-top:8px;
  font-size:14px;
}

/* Input */

.input-box{
  margin-bottom:20px;
}

.input-box input{
  width:100%;
  padding:16px;
  border:none;
  outline:none;
  border-radius:16px;
  background:rgba(0,0,0,0.3);
  border:1px solid rgba(255,255,255,0.08);
  color:white;
  font-size:15px;
}

.input-box input::placeholder{
  color:rgba(255,255,255,0.35);
}

/* Button */

.login-btn{
  width:100%;
  padding:16px;
  border:none;
  border-radius:16px;
  background:linear-gradient(135deg,#ffcc00,#ff9800);
  color:black;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
  transition:0.3s;
}

.login-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 25px rgba(255,179,0,0.35);
}

/* Error */

#error{
  margin-top:18px;
  text-align:center;
  color:#ff6767;
  font-size:14px;
}

</style>
</head>

<body>

<div class="login-box">

  <div class="logo">
    <h1>SECOND WAVE</h1>
    <p>Institutional EA Access</p>
  </div>

  <div class="input-box">
    <input type="text" id="username" placeholder="Username">
  </div>

  <div class="input-box">
    <input type="password" id="password" placeholder="Password">
  </div>

  <button class="login-btn" onclick="login()">
    ACCESS DASHBOARD
  </button>

  <div id="error"></div>

</div>

<script>

function login(){

  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;

  // BASIC LOGIN

  if(username === 'admin' && password === '1234'){

    // CHANGE TO YOUR DASHBOARD FILE
    localStorage.setItem("loggedIn", "true");
window.location.href = 'dashboard.html';

  }else{

    document.getElementById('error').innerHTML =
      'Invalid Username or Password';

  }

}

</script>

</body>
</html>
