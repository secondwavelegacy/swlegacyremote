<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Second Wave App</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#000;
}

/* MENU */

#menuPage{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0d0d0d;
    color:white;
}

.container{
    text-align:center;
}

h1{
    font-size:42px;
    margin-bottom:15px;
}

p{
    color:#999;
    margin-bottom:40px;
}

.button{
    display:block;
    width:260px;
    margin:15px auto;
    padding:18px;
    background:#2962ff;
    color:white;
    border:none;
    border-radius:12px;
    font-size:20px;
    cursor:pointer;
}

/* CHART */

#chartPage{
    display:none;
    width:100%;
    height:100vh;
    position:relative;
}

iframe{
    width:100%;
    height:100%;
    border:none;
}

.backBtn{
    position:absolute;
    top:15px;
    left:15px;
    z-index:9999;
    background:#111;
    border:1px solid #444;
    width:auto;
    padding:12px 20px;
}

</style>
</head>

<body>

<!-- MENU -->

<div id="menuPage">

    <div class="container">

        <h1>Second Wave App</h1>

        <p>XAUUSD Trading Access</p>

        <button class="button" onclick="openChart()">
            Open Trading
        </button>

    </div>

</div>

<!-- CHART -->

<div id="chartPage">

    <button class="button backBtn" onclick="goBackMenu()">
        ⬅ Back
    </button>

    <iframe
    src="https://www.tradingview.com/chart/EnUI8WrU/?symbol=FX%3AXAUUSD">
    </iframe>

</div>

<script>

function openChart(){

    document.getElementById("menuPage").style.display = "none";

    document.getElementById("chartPage").style.display = "block";
}

function goBackMenu(){

    document.getElementById("chartPage").style.display = "none";

    document.getElementById("menuPage").style.display = "flex";
}

</script>

</body>
</html>
