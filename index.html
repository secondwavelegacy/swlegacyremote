<!DOCTYPE html>
<html>
<head>
  <title>XAUUSD TradingView Chart</title>

  <style>
    body{
      margin:0;
      background:#111;
      color:white;
      font-family:Arial;
    }

    h1{
      text-align:center;
      padding:15px;
      margin:0;
      background:#000;
    }

    .tradingview-widget-container{
      height:92vh;
      width:100%;
    }

    #tradingview_chart{
      height:100%;
      width:100%;
    }
  </style>
</head>

<body>

<h1>XAUUSD Live TradingView Chart</h1>

<div class="tradingview-widget-container">
  <div id="tradingview_chart"></div>

  <script type="text/javascript"
    src="https://s3.tradingview.com/tv.js">
  </script>

  <script type="text/javascript">
    new TradingView.widget({
      "width": "100%",
      "height": "100%",
      "symbol": "FX:XAUUSD",
      "interval": "5",
      "timezone": "Asia/Kuala_Lumpur",
      "theme": "dark",
      "style": "1",
      "locale": "en",
      "toolbar_bg": "#111111",
      "enable_publishing": false,
      "hide_side_toolbar": false,
      "allow_symbol_change": true,
      "save_image": true,
      "container_id": "tradingview_chart"
    });
  </script>
</div>

</body>
</html>
