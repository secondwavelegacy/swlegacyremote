<!DOCTYPE html>
<html>
<head>
  <title>TradingView Widget</title>

  <style>
    body{
      margin:0;
      background:#111;
      color:white;
      font-family:Arial;
    }

    h1{
      text-align:center;
      padding:15px;
    }

    .tradingview-widget-container{
      height:90vh;
    }
  </style>
</head>

<body>

<h1>TradingView Live Chart</h1>

<div class="tradingview-widget-container">
  <div id="tradingview_chart"></div>

  <script type="text/javascript"
  src="https://www.tradingview.com/chart/EnUI8WrU/?symbol=FX%3AXAUUSD">
  </script>

  <script type="text/javascript">
  new TradingView.widget({
    "width": "100%",
    "height": "100%",
    "symbol": "BINANCE:BTCUSDT",
    "interval": "15",
    "timezone": "Asia/Kuala_Lumpur",
    "theme": "dark",
    "style": "1",
    "locale": "en",
    "toolbar_bg": "#111111",
    "enable_publishing": false,
    "hide_top_toolbar": false,
    "save_image": true,
    "container_id": "tradingview_chart"
  });
  </script>
</div>

</body>
</html>
