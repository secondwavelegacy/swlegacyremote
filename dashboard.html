
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SW Legacy Manager</title>

<script>
if(localStorage.getItem("loggedIn") !== "true"){
  window.location.href = "index.html";
}
</script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#050505;
  color:white;
  overflow-x:hidden;
}

body::before{
  content:'';
  position:fixed;
  width:500px;
  height:500px;
  background:rgba(255,174,0,0.12);
  filter:blur(120px);
  top:-100px;
  left:-100px;
  z-index:-1;
}

body::after{
  content:'';
  position:fixed;
  width:400px;
  height:400px;
  background:rgba(255,120,0,0.10);
  filter:blur(120px);
  bottom:-100px;
  right:-100px;
  z-index:-1;
}

.container{
  padding:20px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px;
  border:1px solid rgba(255,255,255,0.08);
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(20px);
  border-radius:25px;
  margin-bottom:20px;
  flex-wrap:wrap;
  gap:15px;
}

.menu{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.menu-link{
  text-decoration:none;
  color:rgba(255,255,255,0.65);
  padding:10px 18px;
  border-radius:14px;
  transition:0.3s;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.05);
  font-size:14px;
}

.menu-link:hover{
  color:#ffb300;
  border:1px solid rgba(255,179,0,0.25);
  background:rgba(255,179,0,0.08);
}

.menu-link.active{
  background:linear-gradient(135deg,#ffcc00,#ff9800);
  color:black;
  font-weight:600;
}

.logo h1{
  color:#ffb300;
  letter-spacing:3px;
  font-size:30px;
}

.logo p{
  color:rgba(255,255,255,0.45);
  margin-top:5px;
  font-size:13px;
}

.status{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
}

.status-box{
  padding:12px 18px;
  border-radius:16px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  font-size:14px;
}

.connected{
  color:#42ff8c;
  border:1px solid rgba(0,255,140,0.3);
  background:rgba(0,255,140,0.08);
}

.disconnected{
  color:#ff5c5c;
  border:1px solid rgba(255,0,0,0.3);
  background:rgba(255,0,0,0.08);
}

.dashboard{
  display:grid;
  grid-template-columns:1fr 2fr 1fr;
  gap:20px;
}

.card{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  border-radius:28px;
  padding:22px;
  box-shadow:0 10px 40px rgba(0,0,0,0.3);
}

.title{
  font-size:18px;
  margin-bottom:18px;
  font-weight:600;
}

.chart{
  height:520px;
  border-radius:28px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,0.08);
  background:#0f0f0f;
}

#tradingview_chart{
  width:100%;
  height:100%;
}

@media(max-width:1100px){
  .dashboard{
    grid-template-columns:1fr;
  }

  .chart{
    height:400px;
  }
}
</style>
</head>

<body>

<div class="container">

<div class="topbar">

<div class="logo" style="display:flex;align-items:center;gap:15px;">

<img
src="logo.png"

>

<div>

</div>

</div>

<div class="menu">
<a href="dashboard.html" class="menu-link active">Dashboard</a>
<a href="control.html" class="menu-link">Trade Control</a>
<a href="analytics.html" class="menu-link">Analytics</a>
<a href="settings.html" class="menu-link">Settings</a>
</div>

<div class="status">

<div class="status-box disconnected" id="mt5Status">
● MT5 DISCONNECTED
</div>

<div class="status-box">
Balance :
<span id="balanceAmount">$0</span>

<span
onclick="toggleBalance()"
id="eyeIcon"
style="cursor:pointer;margin-left:8px;user-select:none;"
>
<i class="fa-solid fa-eye"></i>
</span>

</div>

</div>

</div>

<div class="dashboard">

<div>
<div class="card">

<p style="margin-top:15px;color:rgba(255,255,255,0.6);">
Realtime MT5 control panel connected with Firebase.

</div>

<div>

<div class="card" style="margin-bottom:20px;">
<div class="title">Account Analytics</div>

<div style="margin-bottom:20px;">
<div style="display:flex;justify-content:space-between;margin-bottom:8px;">
<span>Equity</span>
<span id="equityAmount">$0</span>
</div>

<div style="height:10px;background:#111;border-radius:20px;overflow:hidden;">

</div>

BUY XAUUSD confirmed

</div>

</div>

</div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script>
function loadTradingView(){

if(typeof TradingView === "undefined"){
return;
}

new TradingView.widget({
container_id:"tradingview_chart",
autosize:true,
symbol:"OANDA:XAUUSD",
interval:"15",
timezone:"Asia/Kuala_Lumpur",
theme:"dark",
style:"1",
locale:"en",
toolbar_bg:"#0f0f0f",
enable_publishing:false,
allow_symbol_change:true
});
}

window.onload=function(){
setTimeout(loadTradingView,500);
};
</script>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
onValue
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyCqxsYWRuwfS2lsc2v6qmzB_LFR3HGx3H8",
authDomain:"sw-legacy-manager.firebaseapp.com",
databaseURL:"https://sw-legacy-manager-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"sw-legacy-manager",
storageBucket:"sw-legacy-manager.firebasestorage.app",
messagingSenderId:"267816826332",
appId:"1:267816826332:web:7499b47bdb5a0679024b19"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const balanceEl=document.getElementById("balanceAmount");
const eyeEl=document.getElementById("eyeIcon");
const mt5StatusEl=document.getElementById("mt5Status");
const equityAmount=document.getElementById("equityAmount");
const equityBar=document.getElementById("equityBar");

let balanceHidden=localStorage.getItem("balanceHidden") === "true";
let currentBalance=0;

function updateBalanceUI(){

if(balanceHidden){

balanceEl.textContent="••••••";

eyeEl.innerHTML='<i class="fa-solid fa-eye-slash"></i>';

}else{

balanceEl.textContent="$" + currentBalance;

eyeEl.innerHTML='<i class="fa-solid fa-eye"></i>';

}
}

window.toggleBalance=function(){
balanceHidden=!balanceHidden;
localStorage.setItem("balanceHidden",balanceHidden);
updateBalanceUI();
}

const balanceRef=ref(db,"account/balance");

onValue(balanceRef,(snapshot)=>{
const val=snapshot.val();

if(val !== null){
currentBalance=val;
updateBalanceUI();

equityAmount.textContent="$" + val;

const percent=Math.min((val / 20000) * 100,100);
equityBar.style.width=percent + "%";
}
});

const statusRef=ref(db,"account/status");

onValue(statusRef,(snapshot)=>{
const status=snapshot.val();

if(status === "CONNECTED"){

mt5StatusEl.innerHTML="● MT5 CONNECTED";
mt5StatusEl.classList.add("connected");
mt5StatusEl.classList.remove("disconnected");

}else{

mt5StatusEl.innerHTML="● MT5 DISCONNECTED";
mt5StatusEl.classList.add("disconnected");
mt5StatusEl.classList.remove("connected");

}
});

updateBalanceUI();

</script>

</body>
</html>
}
